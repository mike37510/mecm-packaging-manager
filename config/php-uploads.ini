; SCCM Packaging Manager — uploads installateurs volumineux (Adobe, Office, …)
upload_max_filesize = 1024M
post_max_size = 1100M
max_execution_time = 3600
max_input_time = 3600
memory_limit = 512M

; Sessions / temp on the bind-mounted storage volume (not the Docker overlay /tmp)
session.save_path = /var/www/html/storage/cache/sessions
sys_temp_dir = /var/www/html/storage/cache/tmp
upload_tmp_dir = /var/www/html/storage/cache/tmp
