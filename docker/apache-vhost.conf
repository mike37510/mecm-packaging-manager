<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    # Gros installateurs (Adobe, Office, …) : jusqu’à ~1 Go
    Timeout 3600
    RequestReadTimeout header=20-40,minrate=500
    RequestReadTimeout body=60-3600,minrate=1000
    LimitRequestBody 1200000000

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Deny direct access to app internals if DocumentRoot ever misconfigured
    <DirectoryMatch "^/var/www/html/(config|src|templates|bin|storage|vendor|tests)">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
